name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  RELEASE_VERSION: ${{ github.ref_name }}
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write

      actions: read
      issues: read
      packages: write
      pull-requests: read
      repository-projects: read
      statuses: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create changelog for release
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: 'changelog.config.json'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release
        uses: ncipollo/release-action@v1
        with:
          makeLatest: true
          allowUpdates: true
          body: |
            ## 🔗 Artifact link

            ```
            https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/decky-launch-options-recipes.zip
            ```
            
            ${{ steps.github_release.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}
  #          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha')}}

  deploy:
    needs: [ release ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write

      actions: read
      issues: read
      packages: write
      pull-requests: read
      repository-projects: read
      statuses: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set package.json version
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.version = process.env.RELEASE_VERSION.replace(/^v/, '');
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          JS

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Decky CLI Build
        run: |
          mkdir $(pwd)/cli
          curl -L -o $(pwd)/cli/decky "https://github.com/SteamDeckHomebrew/cli/releases/latest/download/decky-linux-x86_64"
          chmod +x $(pwd)/cli/decky
          $(pwd)/cli/decky plugin build $(pwd)
          mv "out/Launch Options Recipes.zip" "out/decky-launch-options-recipes.zip"

      - name: Upload artifacts to Release
        uses: alexellis/upload-assets@0.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          asset_paths: '["./out/*"]'

      - name: Rollback Release
        if: failure()
        uses: author/action-rollback@stable
        with:
          tag: ${{ env.RELEASE_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
