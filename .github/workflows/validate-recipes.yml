name: Build recipes.json

on:
  push:
    branches:
      - '**'
    paths:
      - 'recipes/**/*.ts'
      - 'scripts/build-recipes.ts'
      - 'tsconfig.recipes.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches:
      - '**'
    paths:
      - 'recipes/**/*.ts'
      - 'scripts/build-recipes.ts'
      - 'tsconfig.recipes.json'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: write

jobs:
  build-recipes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build recipes.json
        run: pnpm recipes:build

      - name: Commit and push generated recipes.json
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- recipes.json; then
            echo "recipes.json is already up to date"
            exit 0
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add recipes.json
          git commit -m "chore: rebuild recipes.json"
          git push

      - name: Verify generated recipes.json is committed
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- recipes.json
