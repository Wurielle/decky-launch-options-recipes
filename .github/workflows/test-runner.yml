name: Test shared runner

on:
  pull_request:
    paths:
      - 'defaults/dlor-run.sh'
      - 'main.py'
      - 'scripts/test-runner.py'
      - 'scripts/runner_test_support.py'
      - 'scripts/test-log-retention.py'
      - 'scripts/test-script-logging.py'
      - '.github/workflows/test-runner.yml'
  push:
    branches: [dev]
    paths:
      - 'defaults/dlor-run.sh'
      - 'main.py'
      - 'scripts/test-runner.py'
      - 'scripts/runner_test_support.py'
      - 'scripts/test-log-retention.py'
      - 'scripts/test-script-logging.py'
      - '.github/workflows/test-runner.yml'

permissions:
  contents: read

jobs:
  test-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n defaults/dlor-run.sh
      - name: Test installed runner and command cache
        run: python3 scripts/test-runner.py -v
      - name: Test log retention
        run: python3 scripts/test-log-retention.py -v
      - name: Test script logging and launch continuation
        run: python3 scripts/test-script-logging.py -v
