name: Tag release
on:
  push:
    branches:
      - main
      - pre/rc
      - beta
      - alpha
  workflow_dispatch:

# Only this workflow writes generated files on release branches. Queue releases
# and check out the current branch tip after any earlier run has finished.
concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag-release:
    if: contains(fromJSON('["main", "pre/rc", "beta", "alpha"]'), github.ref_name)
    name: Tag release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          # Bot commits and tags must not recursively trigger push workflows.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build recipes.json
        env:
          RECIPE_REPOSITORY_OWNER: ${{ github.repository_owner }}
          RECIPE_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: RECIPE_COMMIT_SHA="$(git rev-parse HEAD)" pnpm recipes:build

      - name: Determine release version
        uses: cycjimmy/semantic-release-action@v6
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          dry_run: true

      - name: Set package version
        if: steps.semantic-release.outputs.new_release_version != ''
        env:
          RELEASE_VERSION: ${{ steps.semantic-release.outputs.new_release_version }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.version = process.env.RELEASE_VERSION;
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          JS

      - name: Commit release inputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json recipes.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(release): update package version and recipes"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish tag
        if: steps.semantic-release.outputs.new_release_version != ''
        uses: cycjimmy/semantic-release-action@v6
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          dry_run: false

      - name: Start release build
        if: steps.publish.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.publish.outputs.new_release_git_tag }}
        # GITHUB_TOKEN tag pushes don't trigger another push workflow, but an
        # explicit workflow_dispatch does. It also allows manual retry by tag.
        run: gh workflow run release.yml --ref "$RELEASE_TAG"
